<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despesas da casa</title>
<meta name="theme-color" content="#1f3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="setup-mode">
<div class="wrap">

  <!-- LIGAR (primeira vez neste telemóvel) -->
  <section id="setup" hidden>
    <header class="top"><h1>Despesas da casa</h1></header>
    <form id="sf" class="card" novalidate>
      <p style="margin-top:0"><strong>Ligar este telemóvel</strong></p>
      <p class="muted">Cola aqui o endereço do servidor e o código de acesso. Só é preciso fazer isto uma vez. Se recebeste um link de acesso, basta abri-lo e isto é preenchido sozinho.</p>
      <label class="lbl" for="sUrl">Endereço do servidor</label>
      <input id="sUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      <label class="lbl" for="sTok">Código de acesso</label>
      <input id="sTok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="err-inline" id="sErr" role="alert"></div>
      <button class="primary" id="sBtn" type="submit">Ligar</button>
    </form>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <header class="top">
      <h1>Despesas da casa</h1>
      <button type="button" class="icon-btn on-bg" id="refresh" aria-label="Atualizar dados"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    </header>
    <div id="banner" class="banner" role="status" hidden></div>
    <main>
      <section id="tab-add" class="tab active" role="tabpanel" aria-label="Adicionar despesa"></section>
      <section id="tab-dash" class="tab" role="tabpanel" aria-label="Painel"></section>
      <section id="tab-debt" class="tab" role="tabpanel" aria-label="Dívidas"></section>
      <section id="tab-list" class="tab" role="tabpanel" aria-label="Despesas"></section>
      <section id="tab-set" class="tab" role="tabpanel" aria-label="Definições"></section>
    </main>
  </div>
</div>

<nav id="nav" role="tablist" aria-label="Secções" hidden>
  <button type="button" role="tab" data-tab="add" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Adicionar</span></button>
  <button type="button" role="tab" data-tab="dash" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg><span>Painel</span></button>
  <button type="button" role="tab" data-tab="debt" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg><span>Dívidas</span></button>
  <button type="button" role="tab" data-tab="list" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Despesas</span></button>
  <button type="button" role="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Definições</span></button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="backdrop" id="sheetBackdrop"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="ph"><h2 id="sheetTitle"></h2><button type="button" class="icon-btn" id="sheetClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<datalist id="descList"></datalist>
<div id="toast" role="status" aria-live="polite"></div>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
